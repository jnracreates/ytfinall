<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ytfinall Connector</title>
  <style>
    * { box-sizing: border-box; }
    html { width: 480px !important; min-width: 480px !important; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 480px; margin: 0; padding: 12px 16px; background: #fff; color: #222; }
    h3 { margin: 0 0 10px; font-size: 16px; }
    label { display: block; margin-top: 6px; font-weight: 600; font-size: 13px; color: #444; }
    input { width: 100%; padding: 8px; margin-top: 3px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 10px; margin-top: 10px; background: #00a4dc; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #aaa; cursor: default; }
    .status { margin-top: 10px; font-size: 13px; min-height: 18px; }
    .status.ok { color: #0a5; }
    .status.err { color: #c00; }
    .hidden { display: none; }
    .hint { font-size: 12px; color: #777; margin-top: 4px; }
  </style>
</head>
<body>

<div id="view-login">
  <h3>ytfinall Login</h3>
  <label for="backendUrl">ytfinall Server URL</label>
  <input type="url" id="backendUrl" placeholder="http://192.168.1.50:6842">
  <div class="hint">Use LAN IP on mobile, not localhost.</div>
  <label for="username">Jellyfin Username</label>
  <input type="text" id="username" autocomplete="username">
  <label for="password">Password</label>
  <input type="password" id="password" autocomplete="current-password">
  <button id="loginBtn">Log In</button>
  <div class="status" id="loginStatus"></div>
</div>

<div id="view-send" class="hidden">
  <h3>Send to ytfinall</h3>
  <p style="font-size:13px;color:#555;margin:0 0 4px">Logged in as <strong id="whoami"></strong></p>
  <label for="videoUrl">YouTube URL</label>
  <input type="url" id="videoUrl" placeholder="https://youtube.com/watch?v=...">
  <button id="sendBtn">Send to Library</button>
  <div class="status" id="sendStatus"></div>
  <button id="logoutBtn" style="background:#eee;color:#333;margin-top:20px">Log Out</button>
</div>

<script src="popup.js"></script>
</body>
</html>
